spring:
  datasource:
    url: jdbc:h2:mem:audit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  # 集成测试关闭定时任务，改为手动驱动流程
  task:
    scheduling:
      enabled: false
  # 测试不连 broker：排除 RocketMQ 自动装配，事件走 local 实现
  autoconfigure:
    exclude: org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

audit:
  mq:
    type: local

logging:
  level:
    com.example.audit: DEBUG
