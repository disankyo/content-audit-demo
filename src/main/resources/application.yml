server:
  port: 8080

spring:
  application:
    name: content-audit-demo

  datasource:
    # characterEncoding 必须是 Java 字符集名（UTF-8），utf8mb4 是 MySQL 服务端字符集名，
    # 驱动不识别会抛 Unsupported character encoding 'utf8mb4'；如需 utf8mb4 用 connectionCollation 指定
    url: jdbc:mysql://127.0.0.1:3306/audit_demo?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # Spring AI：默认占位符（非空白，保证上下文能启动）；
  # 值为 disabled 时 AiAuditService 判定为「未配置真实密钥」，AI 阶段纯本地降级为「转人工」，不发起任何网络请求。
  # 接入真实模型：export DEEPSEEK_API_KEY=sk-xxxx 后重启即可。
  # 注意：DeepSeek 是 OpenAI 协议兼容的，所以仍走 spring-ai-starter-model-openai，
  #      只换 base-url / model 即可，不需要换依赖。
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:disabled}
      # DeepSeek 官方地址；Spring AI 会自动补 /v1（DeepSeek 也接受 /v1 前缀，两种情况都通）
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          # deepseek-chat = DeepSeek-V3（非思考模式）；要推理模型用 deepseek-reasoner
          model: deepseek-chat
          temperature: 0.1

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 slf4j 统一管控（默认自动探测），不用 StdOutImpl——它绕过日志框架直打印，
    # 定时任务每秒轮询会刷屏；需要临时看 SQL 时把下面的 mapper 包级别调成 DEBUG 即可
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---------- 业务参数 ----------
audit:
  machine:
    # 机审消费者：轮询间隔（毫秒）、每批捞取条数
    poll-interval-ms: 1000
    batch-size: 20
    max-retry: 3
    # 处理中任务卡死回收阈值（分钟）：消费者进程崩溃/被 kill 时，
    # claim 置状态=1 后没机会 deleteById，这一行会永久停在 1、pickBatch 只捞 0，动态卡死在 AUDITING。
    # 超过该时长仍未结束的「处理中」任务由 recoverStuck() 重置回待处理（重试耗尽则标记失败）
    stuck-timeout-min: 5
  manual:
    # 审核员领取任务后几分钟不提交，任务自动回收
    lock-minutes: 5
  ai:
    # 是否启用大模型兜底层（没配 key 就关）
    enabled: true
    timeout-ms: 3000
  # 敏感词库：命中的直接机审驳回（逗号分隔字符串，@Value 绑定最稳妥）
  sensitive-words: "违禁词A,违禁词B,加微信,代购私聊"
  mq:
    # 事件投递实现：本项目统一使用 RocketMQ（见 mq/rocketmq 包）。
    # 业务写库后发消息，消费端收到消息再入对应队列表，做到「写库」与「调度」解耦。
    # 消息在事务提交后才投递（AuditEventPublisher + AfterCommit），避免消费端回查时本地事务未提交。
    type: rocketmq

# RocketMQ：只有 audit.mq.type=rocketmq 时才会真正连 broker
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: audit_producer_group

logging:
  level:
    com.example.audit: DEBUG
    # 业务代码保留 DEBUG，框架层降噪：
    # 1) mapper 包降为 INFO：MyBatis 走 slf4j 后 SQL 是 DEBUG 级、挂在 mapper 接口名下，否则每次轮询都会打印 Preparing/Parameters
    # 2) SqlSession / 连接获取的 DEBUG 噪音（Creating a new SqlSession / JDBC Connection will not be managed...）
    com.example.audit.mapper: INFO
    org.mybatis.spring: WARN
    org.springframework.jdbc: WARN
    org.springframework.transaction: WARN
