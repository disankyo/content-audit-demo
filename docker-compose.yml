version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: audit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: audit_demo
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      # 8.0 默认认证插件与部分客户端不兼容，这里改回 mysql_native_password
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # RocketMQ：只有 audit.mq.type=rocketmq 时才需要起，local 模式不用
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: audit-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: audit-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    # -c 指向挂载的 broker.conf（里面开了 autoCreateTopicEnable，省掉手动建 topic）
    command: >
      sh mqbroker -n rocketmq-namesrv:9876
      -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf

volumes:
  mysql-data:
