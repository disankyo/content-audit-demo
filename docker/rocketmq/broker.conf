# RocketMQ Broker 配置（练手项目用）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 关键：容器里 broker 向 namesrv 注册的是容器 IP，客户端直连会连不上，
# 所以显式声明对外地址为本机。换成服务器部署时改成真实 IP。
brokerIP1 = 127.0.0.1

# 自动创建 topic：省掉手动建 topic 的步骤，生产建议关掉、走运维工单
autoCreateTopicEnable = true

deleteWhen = 04
fileReservedTime = 48
flushDiskType = ASYNC_FLUSH
